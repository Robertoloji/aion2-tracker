<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AION 2 - Rift Tracker & Daily Hub</title>
  <style>
    :root {
      --bg-dark: #0B0E14;
      --card-bg: #151A23;
      --accent-blue: #00D2FF;
      --accent-purple: #9D00FF;
      --text-main: #F0F4F8;
      --text-dim: #8A99AD;
      --status-open: #00FF87;
      --status-closed: #FF0055;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); padding: 20px; max-width: 1200px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #222B38; padding-bottom: 15px; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; letter-spacing: 1px; color: var(--accent-blue); text-transform: uppercase; }
    .utc-clock { font-family: monospace; font-size: 1rem; color: var(--accent-blue); background: #1A222D; padding: 6px 12px; border-radius: 6px; border: 1px solid #2A3644; }

    .controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    button { background: #1F2833; color: var(--text-main); border: 1px solid #334253; padding: 8px 14px; border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
    button:hover { background: #2A3644; border-color: var(--accent-blue); }
    button.active { background: var(--accent-blue); color: #000; font-weight: bold; border-color: var(--accent-blue); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid #222B38; box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .card-title { font-size: 1.1rem; color: var(--accent-blue); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222B38; padding-bottom: 8px; }

    /* Rifts Section */
    .timer-display { font-size: 2.5rem; font-weight: bold; font-family: monospace; text-align: center; margin: 15px 0; color: var(--text-main); }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    .status-open { background: rgba(0, 255, 135, 0.15); color: var(--status-open); border: 1px solid var(--status-open); }
    .status-closed { background: rgba(255, 0, 85, 0.15); color: var(--status-closed); border: 1px solid var(--status-closed); }
    .info-sub { font-size: 0.85rem; color: var(--text-dim); text-align: center; margin-top: 5px; }

    /* Checklist Section */
    .task-list { list-style: none; }
    .task-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #1C2430; transition: 0.2s; }
    .task-item:last-child { border-bottom: none; }
    .task-item label { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; font-size: 0.95rem; }
    .task-item.completed label { text-decoration: line-through; color: var(--text-dim); }
    .char-tag { font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
    .tag-cantor { background: rgba(0, 210, 255, 0.2); color: var(--accent-blue); }
    .tag-sorcerer { background: rgba(157, 0, 255, 0.2); color: var(--accent-purple); }

    /* Boss Section */
    .boss-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #1C2430; }
    .boss-info h4 { font-size: 0.95rem; }
    .boss-info p { font-size: 0.8rem; color: var(--text-dim); }
    .boss-timer { font-family: monospace; font-size: 1rem; color: var(--accent-blue); }

    .progress-bar { width: 100%; height: 6px; background: #1F2833; border-radius: 3px; overflow: hidden; margin-top: 15px; }
    .progress-fill { height: 100%; background: var(--accent-blue); width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>AION 2 Tracker</h1>
      <span style="font-size: 0.8rem; color: var(--text-dim);">Sincronizado con QuestLog.gg</span>
    </div>
    <div class="utc-clock" id="utc-clock">UTC: --:--:--</div>
  </header>

  <div class="controls">
    <button id="btn-audio" onclick="toggleAudio()">🔊 Audio: Desactivado</button>
    <button id="btn-notif" onclick="requestNotifPermission()">🔔 Notificaciones</button>
  </div>

  <div class="grid">
    <!-- SPACES TIME RIFT CARD -->
    <div class="card">
      <div class="card-title">
        <span>GRIETAS ESPACIO-TIEMPO</span>
        <span id="rift-badge" class="status-badge status-closed">Cerradas</span>
      </div>
      <div class="info-sub">Ciclo cada 3 Horas (UTC) • Ventana de 10 Minutos</div>
      <div class="timer-display" id="rift-timer">00:00:00</div>
      <div class="info-sub" id="rift-next-info">Siguiente Apertura: --:-- UTC</div>
    </div>

    <!-- DAILY CHECKLIST CARD -->
    <div class="card">
      <div class="card-title">
        <span>TAREAS DIARIAS</span>
        <span style="font-size: 0.85rem;" id="progress-percent">0%</span>
      </div>
      <div class="controls" style="margin-bottom: 10px;">
        <button class="filter-btn active" onclick="filterTasks('all', this)">Todas</button>
        <button class="filter-btn" onclick="filterTasks('cantor', this)">Cantor</button>
        <button class="filter-btn" onclick="filterTasks('sorcerer', this)">Sorcerer</button>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="task-progress"></div></div>
      <ul class="task-list" id="task-list" style="margin-top: 15px;"></ul>
    </div>

    <!-- FIELD BOSSES CARD -->
    <div class="card">
      <div class="card-title">
        <span>JEFES DE MAPA</span>
        <span style="font-size: 0.8rem; color: var(--text-dim);">Respawn QuestLog</span>
      </div>
      <div id="boss-list"></div>
    </div>
  </div>

  <script>
    // Audio and Notifications
    let audioEnabled = false;
    let notifPermitted = false;
    const RIFT_INTERVAL_HOURS = 3;
    const RIFT_WINDOW_MINUTES = 10;
    const RIFT_HOURS_UTC = [2, 5, 8, 11, 14, 17, 20, 23];

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById('btn-audio');
      btn.innerText = audioEnabled ? "🔊 Audio: Activado" : "🔊 Audio: Desactivado";
      btn.classList.toggle('active', audioEnabled);
      if(audioEnabled) playBeep();
    }

    function requestNotifPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            notifPermitted = true;
            document.getElementById('btn-notif').innerText = "🔔 Notificaciones: OK";
            document.getElementById('btn-notif').classList.add('active');
          }
        });
      }
    }

    function playBeep() {
      if (!audioEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch(e) {}
    }

    function sendNotification(title, body) {
      if (notifPermitted && Notification.permission === 'granted') {
        new Notification(title, { body, icon: 'https://questlog.gg/favicon.ico' });
      }
      playBeep();
    }

    // Rift Logic (Exact Sync with QuestLog UTC)
    let lastRiftState = null;

    function updateRifts() {
      const now = new Date();
      const currentUTCHour = now.getUTCHours();
      const currentUTCMin = now.getUTCMinutes();
      const currentUTCSec = now.getUTCSeconds();

      // Find current or next rift hour
      let nextRiftHour = RIFT_HOURS_UTC.find(h => h > currentUTCHour || (h === currentUTCHour && currentUTCMin < RIFT_WINDOW_MINUTES));
      let isNextDay = false;

      if (nextRiftHour === undefined) {
        nextRiftHour = RIFT_HOURS_UTC[0];
        isNextDay = true;
      }

      // Check if inside 10-min window
      const activeRiftHour = RIFT_HOURS_UTC.find(h => h === currentUTCHour && currentUTCMin < RIFT_WINDOW_MINUTES);
      const isOpen = activeRiftHour !== undefined;

      const badge = document.getElementById('rift-badge');
      const timerElem = document.getElementById('rift-timer');
      const nextInfo = document.getElementById('rift-next-info');

      if (isOpen) {
        badge.className = 'status-badge status-open';
        badge.innerText = '¡GRIETA ABIERTA!';
        
        const remainingSecs = (RIFT_WINDOW_MINUTES * 60) - (currentUTCMin * 60 + currentUTCSec);
        timerElem.innerText = formatSeconds(remainingSecs);
        nextInfo.innerText = `Cierra a las ${String(activeRiftHour).padStart(2, '0')}:${String(RIFT_WINDOW_MINUTES).padStart(2, '0')} UTC`;

        if (lastRiftState !== 'open') {
          sendNotification('AION 2: Grieta Abierta', '¡La Grieta del Espacio-Tiempo está disponible durante 10 minutos!');
          lastRiftState = 'open';
        }
      } else {
        badge.className = 'status-badge status-closed';
        badge.innerText = 'Grietas Cerradas';

        const targetDate = new Date(Date.UTC(
          now.getUTCFullYear(),
          now.getUTCMonth(),
          now.getUTCDate() + (isNextDay ? 1 : 0),
          nextRiftHour, 0, 0
        ));

        const diffSecs = Math.floor((targetDate - now) / 1000);
        timerElem.innerText = formatSeconds(diffSecs);
        nextInfo.innerText = `Siguiente Apertura: ${String(nextRiftHour).padStart(2, '0')}:00 UTC`;

        if (lastRiftState !== 'closed') {
          lastRiftState = 'closed';
        }

        // 5 minute warning
        if (diffSecs === 300) {
          sendNotification('AION 2: Grieta Próxima', '¡Quedan 5 minutos para la apertura de la Grieta!');
        }
      }
    }

    function formatSeconds(secs) {
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // Tasks Management
    const defaultTasks = [
      { id: 1, text: 'Mazmorra Diaria de Escolta', char: 'cantor', done: false },
      { id: 2, text: 'Misiones de Legión / Clan', char: 'cantor', done: false },
      { id: 3, text: 'Rotación PvP de Grietas (Rifts)', char: 'cantor', done: false },
      { id: 4, text: 'Farmeo de Briznas con Sorcerer', char: 'sorcerer', done: false },
      { id: 5, text: 'Recolecta de Materiales de Artesanía', char: 'sorcerer', done: false },
      { id: 6, text: 'Misiones de Tablón de Anuncios', char: 'cantor', done: false }
    ];

    let tasks = JSON.parse(localStorage.getItem('aion2_tasks')) || defaultTasks;
    let currentFilter = 'all';

    function renderTasks() {
      const list = document.getElementById('task-list');
      list.innerHTML = '';

      const filtered = tasks.filter(t => currentFilter === 'all' || t.char === currentFilter);
      let completedCount = tasks.filter(t => t.done).length;

      filtered.forEach(task => {
        const li = document.createElement('li');
        li.className = `task-item ${task.done ? 'completed' : ''}`;
        li.innerHTML = `
          <label>
            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${task.id})">
            <span>${task.text}</span>
          </label>
          <span class="char-tag ${task.char === 'cantor' ? 'tag-cantor' : 'tag-sorcerer'}">${task.char.toUpperCase()}</span>
        `;
        list.appendChild(li);
      });

      const pct = Math.round((completedCount / tasks.length) * 100) || 0;
      document.getElementById('task-progress').style.width = `${pct}%`;
      document.getElementById('progress-percent').innerText = `${pct}%`;
      localStorage.setItem('aion2_tasks', JSON.stringify(tasks));
    }

    function toggleTask(id) {
      tasks = tasks.map(t => t.id === id ? { ...t, done: !t.done } : t);
      renderTasks();
    }

    function filterTasks(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTasks();
    }

    // Bosses Mock/Track
    const bosses = [
      { name: 'Nazaul el Devorador', zone: 'Garmon Pass', respawnMins: 120 },
      { name: 'Kardesh Sombraluna', zone: 'Reserva de Tiamat', respawnMins: 180 },
      { name: 'Reina Harpyia Vaxia', zone: 'Cresta de Viento', respawnMins: 240 }
    ];

    function renderBosses() {
      const container = document.getElementById('boss-list');
      container.innerHTML = bosses.map(b => `
        <div class="boss-item">
          <div class="boss-info">
            <h4>${b.name}</h4>
            <p>${b.zone} • Respawn cada ${b.respawnMins}m</p>
          </div>
          <div class="boss-timer">DISPONIBLE</div>
        </div>
      `).join('');
    }

    // Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('utc-clock').innerText = `UTC: ${now.toUTCString().split(' ')[4]}`;
      updateRifts();
    }

    setInterval(updateClock, 1000);
    renderTasks();
    renderBosses();
    updateClock();
  </script>
</body>
</html>
